<!DOCTYPE html>
<html>
<head>
    <title>HTML CSS Assignment</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f4f4f4;
        }

        /* Navbar */
        .navbar{
            background:black;
            color:white;
            padding:15px;

            display:flex;
            justify-content:space-between;
        }

        .navbar ul{
            display:flex;
            list-style:none;
        }

        .navbar li{
            margin-left:15px;
        }

        /* Hero */
        .hero{
            background:blue;
            color:white;
            text-align:center;
            padding:40px;
        }

        /* Flexbox */
        .flex{
            display:flex;
            gap:20px;
            justify-content:center;
            padding:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
        }

        /* Grid */
        .grid{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:10px;
            padding:20px;
        }

        .box{
            background:skyblue;
            padding:30px;
            text-align:center;
        }

        /* Positions */

        .static{
            position:static;
            background:lightgray;
            padding:10px;
            margin:10px;
        }

        .relative{
            position:relative;
            left:20px;
            background:orange;
            padding:10px;
            margin:10px;
        }

        .absolute-parent{
            position:relative;
            height:100px;
            background:#ddd;
            margin:10px;
        }

        .absolute{
            position:absolute;
            top:10px;
            right:10px;
            background:red;
            color:white;
            padding:10px;
        }

        .sticky{
            position:sticky;
            top:0;
            background:green;
            color:white;
            padding:10px;
        }

        .fixed{
            position:fixed;
            bottom:10px;
            right:10px;
            background:black;
            color:white;
            padding:10px;
        }

    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">

        <h2>My Site</h2>

        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>

    </div>

    <!-- Hero -->
    <div class="hero">

        <h1>HTML CSS Assignment</h1>

    </div>

    <!-- Flexbox -->
    <div class="flex">

        <div class="card">HTML</div>
        <div class="card">CSS</div>
        <div class="card">Flexbox</div>

    </div>

    <!-- Grid -->
    <div class="grid">

        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>

    </div>

    <!-- Positions -->
    <div class="sticky">Sticky Position</div>

    <div class="static">Static Position</div>

    <div class="relative">Relative Position</div>

    <div class="absolute-parent">

        <div class="absolute">
            Absolute
        </div>

    </div>

    <div class="fixed">
        Fixed
    </div>

</body>
</html>
